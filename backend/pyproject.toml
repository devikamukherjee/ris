[project]
name = "permit-guardian"
version = "0.1.0"
description = "Human-in-the-loop permit-to-work assistant (portfolio project)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "ollama>=0.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
analysis = [
    "pandas>=2.2",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
